# Builds سرد TV (the overlay app that shows subtitles over the TV picture) and publishes it at:
#   https://github.com/misharialhazzani-arch/momiji/releases/download/tv-latest/sard-tv.apk
name: Build Sard TV APK

on:
  push:
    branches: [sard]
    paths:
      - "sard-overlay/**"
      - ".github/workflows/sard-tv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sard-tv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Without the SARD_KEYSTORE secrets each build gets a new key, and updating means reinstalling
      - name: Signing
        env:
          SARD_KEYSTORE: ${{ secrets.SARD_KEYSTORE }}
          SARD_KEYSTORE_PASSWORD: ${{ secrets.SARD_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/sard.jks"
          if [ -n "$SARD_KEYSTORE" ] && [ -n "$SARD_KEYSTORE_PASSWORD" ]; then
            echo "$SARD_KEYSTORE" | base64 -d > "$KS"
            PW="$SARD_KEYSTORE_PASSWORD"
          else
            PW="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$KS" -alias sard -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=Sard" > /dev/null
          fi
          cat > sard-overlay/local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          sardKeystore=$KS
          sardKeystorePW=$PW
          sardKeyAlias=sard
          sardKeyPW=$PW
          EOF

      - name: Build
        working-directory: sard-overlay
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; then
            WHY=$(grep -E -A12 "What went wrong" build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            ERRS=$(grep -E "^e: |error:|ERROR:" build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=What went wrong::${WHY:0:20000}"
            echo "::error title=Errors::${ERRS:0:20000}"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../sard-tv.apk

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-latest
          name: سرد TV
          body: |
            تطبيق التلفزيون: يعرض الترجمة العربية فوق اللعبة.
            ثبّته من Downloader بهذا الرابط:
            https://github.com/${{ github.repository }}/releases/download/tv-latest/sard-tv.apk
          files: sard-tv.apk
          make_latest: false
          overwrite_files: true
